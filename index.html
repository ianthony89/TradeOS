<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="color-scheme" content="dark light"/>
  <title>TradeOS · v4.0</title>

  <!-- Tokens first (themes.css defines :root), then base/components -->
  <link rel="stylesheet" href="css/themes.css"/>
  <link rel="stylesheet" href="css/main.css"/>
</head>
<body>

  <!-- ============================================================
       LOCK SCREEN — visible on load; hidden once auth resolves
       ============================================================ -->
  <div class="lock-wrap show" id="lock" role="dialog" aria-modal="true">
    <div class="lock-card">
      <div class="lock-logo">T</div>
      <div class="lock-title" id="lockTitle">…</div>
      <div class="lock-sub"   id="lockSub">…</div>
      <div class="lock-dots"  id="lockDots"></div>
      <div class="lock-pad"   id="lockPad"></div>
      <div class="lock-msg"   id="lockMsg"></div>
      <div class="hstack" style="justify-content:center; margin-top:14px; gap:10px;">
        <button class="btn primary sm" id="lockSubmit" aria-label="Submit">→</button>
        <button class="btn ghost sm"   id="lockForget" style="display:none">…</button>
      </div>
      <div class="lock-foot" id="lockBrand">TradeOS · v4</div>
    </div>
  </div>

  <!-- ============================================================
       MOBILE OVERLAY
       ============================================================ -->
  <button class="mobile-toggle" id="mobileToggle" aria-label="Menu">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div class="mobile-backdrop" id="mobileBackdrop"></div>

  <!-- ============================================================
       APP SHELL — hidden until auth unlocks
       ============================================================ -->
  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <header class="topbar" id="topbar"></header>
      <div id="stage"></div>
    </main>
  </div>

  <!-- Toast host (auto-created by toast.js if missing — also pre-declared here) -->
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <!-- Single ES-module entry. Resolves the rest of the graph. -->
  <script type="module" src="js/app.js"></script>

  <!-- Mobile sidebar wiring (small, no need to module-load) -->
  <script>
    (function() {
      const tog = document.getElementById('mobileToggle');
      const bd  = document.getElementById('mobileBackdrop');
      const app = document.getElementById('app');
      const close = () => app.classList.remove('mobile-open');
      tog.addEventListener('click', () => app.classList.toggle('mobile-open'));
      bd.addEventListener('click', close);
      // Close drawer when a nav link is clicked.
      document.addEventListener('click', (e) => {
        if (e.target.closest('.nav-item') && app.classList.contains('mobile-open')) close();
      });
    })();
  </script>
</body>
</html>
